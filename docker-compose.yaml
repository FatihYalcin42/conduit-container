services:
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: "${API_BASE_URL:-/api}"
    ports:
      - "${FRONTEND_PORT:-8282}:80"
    environment:
      BACKEND_PORT: "${BACKEND_PORT:-8000}"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        APP_PORT: "${BACKEND_PORT:-8000}"
    environment:
      APP_NAME: "${APP_NAME:-conduit-backend}"
      APP_ENV: "${APP_ENV:-development}"
      APP_HOST: "${APP_HOST:-0.0.0.0}"
      APP_PORT: "${BACKEND_PORT:-8000}"
      POSTGRES_DB: "${POSTGRES_DB:-conduit}"
      POSTGRES_USER: "${POSTGRES_USER:-conduit}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me}"
      POSTGRES_HOST: "${POSTGRES_HOST:-db}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_SSLMODE: "${POSTGRES_SSLMODE:-prefer}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-conduit}"
      POSTGRES_USER: "${POSTGRES_USER:-conduit}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:${POSTGRES_PORT:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conduit} -d ${POSTGRES_DB:-conduit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
